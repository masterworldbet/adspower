name: Build MasterBrowser for Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium firefox
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build Windows portable package
        run: npm run package:portable
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: MasterBrowser-Windows-Portable
          path: release/win-unpacked/
          if-no-files-found: error
          retention-days: 14
      - name: Packaged desktop smoke test
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'release/win-unpacked/MasterBrowser.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop smoke test failed: $($process.ExitCode)" }
      - name: Build Windows installer
        run: npm run package:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MasterBrowser-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload files for release
        uses: actions/upload-artifact@v4
        with:
          name: MasterBrowser-Release-Files
          path: |
            release/*-win.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-downloads:
    name: Publish direct downloads
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [windows, browser-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MasterBrowser-Release-Files
          path: artifacts
      - name: Publish ZIP and installer to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-${{ github.run_number }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/*-win.zip MasterBrowser-Windows.zip
          cp artifacts/*.exe MasterBrowser-Setup.exe
          gh release create "$RELEASE_TAG" MasterBrowser-Windows.zip MasterBrowser-Setup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MasterBrowser Windows build $GITHUB_RUN_NUMBER" --notes "Windows portable ZIP and installer. Automated checks passed; see the linked commit and workflow for validation details. Extract the entire ZIP before running MasterBrowser.exe." --latest

  browser-validation:
    name: Browser tests (${{ matrix.browser }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      BROWSER_TEST_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - name: Verify browser session isolation
        timeout-minutes: 2
        run: npm run test:browser
